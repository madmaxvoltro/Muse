name: images

# Ready-made images for docker-compose.images.yml: ghcr.io/<owner>/muse-<name>, for
# linux/amd64 and linux/arm64. `latest` follows main; a tag v1.2.3 also publishes 1.2.3 and 1.2.
# The first time a package appears on GHCR it is private: make it public once under
# Packages > muse-<name> > Package settings, or installs can't pull it (they then build locally).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "jellyfin-plugin/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: admin, dockerfile: services/admin/Dockerfile}
          - {name: ingestion-api, dockerfile: services/ingestion-api/Dockerfile}
          - {name: recommendation-api, dockerfile: services/recommendation-api/Dockerfile}
          - {name: embedding-worker, dockerfile: services/embedding-worker/Dockerfile}
          - {name: query-api, dockerfile: services/query-api/Dockerfile}
          - {name: catalog, dockerfile: services/catalog/Dockerfile}
          - {name: audio-analyzer, dockerfile: services/audio-analyzer/Dockerfile}
          - {name: scheduler, dockerfile: services/scheduler/Dockerfile}
          - {name: curator, dockerfile: services/curator/Dockerfile}
          - {name: mcp-server, dockerfile: services/mcp-server/Dockerfile}
          - {name: jellyfin-adapter, dockerfile: adapters/jellyfin/Dockerfile}
          - {name: navidrome-adapter, dockerfile: adapters/navidrome/Dockerfile}
          - {name: audiobookshelf-adapter, dockerfile: adapters/audiobookshelf/Dockerfile}
          - {name: arr-adapter, dockerfile: adapters/arr/Dockerfile}
          - {name: searxng-adapter, dockerfile: adapters/searxng/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/muse-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=muse-${{ matrix.name }}
            org.opencontainers.image.description=Muse ${{ matrix.name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
