name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MUSE_TEST_PG: postgresql://postgres@127.0.0.1:5433/postgres
      MUSE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/muse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: psql "postgresql://postgres@127.0.0.1:5433/postgres" -c "CREATE DATABASE muse_test"
      - run: |
          pip install asyncpg cryptography fastapi httpx numpy pydantic python-multipart qdrant-client scipy \
            "uvicorn[standard]" icalendar recurring-ical-events tzdata pytest pytest-asyncio opencv-python-headless
      - run: python -m pytest tests -q
      - name: the setup tool runs on plain Python
        run: python3 muse --help >/dev/null && python3 -c "import sys; sys.path.insert(0, 'installer'); import qr; qr.encode('x')"
