[project]
name = "muse-mcp"
version = "0.1.0"
description = "MCP server that lets an AI assistant read, search and teach a Muse taste profile"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.scripts]
muse-mcp = "muse_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse_mcp*"]
