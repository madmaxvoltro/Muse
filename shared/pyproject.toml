[project]
name = "muse-schema"
version = "0.1.0"
description = "Shared event schema used by every Muse adapter and service"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse_schema*"]
