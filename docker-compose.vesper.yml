# Muse as Vesper's recommender, on the same machine. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.vesper.yml up -d --build \
#     postgres qdrant ingestion-api recommendation-api embedding-worker jellyfin-adapter
#
# Only those six services: the curator, arr-adapter and searxng-adapter need Radarr/Sonarr/
# SearxNG and are started separately once configured. The two APIs listen on 127.0.0.1
# only (vesper-server runs with host networking); nothing is reachable from the LAN.
# The Jellyfin adapter uses host networking too, so it reaches a Jellyfin bound to localhost.

services:
  ingestion-api:
    ports: ["127.0.0.1:${MUSE_INGEST_PORT:-8771}:8000"]

  recommendation-api:
    ports: ["127.0.0.1:${MUSE_RECO_PORT:-8770}:8001"]
    environment:
      MUSE_READ_KEYS: ${MUSE_READ_KEYS:-}

  jellyfin-adapter:
    network_mode: host
    networks: !reset []
    environment:
      MUSE_INGESTION_URL: http://127.0.0.1:${MUSE_INGEST_PORT:-8771}
      MUSE_WATCH_POLL_INTERVAL_SECONDS: ${MUSE_WATCH_POLL_INTERVAL_SECONDS:-120}
