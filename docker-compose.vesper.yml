# Muse next to Vesper and Jellyfin on the same machine. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.vesper.yml up -d
# (./muse setup with mode "local" writes COMPOSE_FILE so plain `docker compose` / `./muse up` do this.)
#
# The two APIs already listen on 127.0.0.1 only (MUSE_BIND). The Jellyfin adapter uses host
# networking here so it reaches a Jellyfin bound to localhost, and then reaches the ingestion
# API on its localhost port.
services:
  jellyfin-adapter:
    network_mode: host
    networks: !reset []
    depends_on: !reset []
    environment:
      MUSE_INGESTION_URL: http://127.0.0.1:${MUSE_INGEST_PORT:-8771}
