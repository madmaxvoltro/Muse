# NVIDIA GPU for embeddings (and an optional local LLM). Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build \
#     --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cu124 embedding-worker curator
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Needs the NVIDIA Container Toolkit on the host. MUSE_EMBED_DEVICE=auto picks the GPU.
#
# `ollama` is optional: start it with --profile llm, then set
#   MUSE_LLM_PROVIDER=ollama MUSE_LLM_MODEL=qwen3:8b   (and/or MUSE_EMBED_PROVIDER=openai,
#   MUSE_EMBED_BASE_URL=http://ollama:11434/v1, MUSE_EMBEDDING_MODEL=qwen3-embedding:0.6b)
# and pull the models once: docker compose exec ollama ollama pull qwen3:8b

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  embedding-worker:
    <<: *gpu
  curator:
    <<: *gpu

  ollama:
    <<: *gpu
    image: ollama/ollama:latest
    profiles: [llm]
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    networks: [muse-net]

volumes:
  ollama_data:
